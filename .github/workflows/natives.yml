name: Update native definitions

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * SUN

jobs:
  natives:
    permissions:
      contents: write
    uses: overextended/rage-lua-natives/.github/workflows/generate.yml@main
    with:
      native-sets: gta rdr3
      path: library/natives
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
